name: Update database

# Triggers when any file in the 'data/' folder is pushed
on:
  push:
    paths:
      - "data/**"
  workflow_dispatch: {}   # also allows manual runs from the Actions tab

jobs:
  clean-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # needed to commit the updated database back

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt   # pandas, flask (sqlite3 is built-in)

      - name: Run clean_and_merge script to update the database
        run: python clean_and_merge.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add orders.db
          if git diff --cached --quiet; then
            echo "No database changes to commit"
          else
            git commit -m "chore: update orders.db from data/ [skip ci]"
            git push
          fi
