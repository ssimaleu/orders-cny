name: CI

# Continuous Integration: validate the pipeline on every push and pull request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate data pipeline (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt   # pandas, flask (sqlite3 is built-in)

      - name: Run clean_and_merge pipeline as validation
        run: python clean_and_merge.py

      - name: Verify database tables exist and are not empty
        run: |
          python - <<'EOF'
          import sqlite3
          con = sqlite3.connect("orders.db")
          n_orders = con.execute("SELECT COUNT(*) FROM orders").fetchone()[0]
          n_regions = con.execute("SELECT COUNT(*) FROM region_summary").fetchone()[0]
          assert n_orders > 0, "orders table is empty!"
          assert n_regions > 0, "region_summary table is empty!"
          print(f"OK: {n_orders} orders, {n_regions} regions in database")
          EOF

      - name: Smoke test Flask app
        run: |
          python - <<'EOF'
          from app import app
          client = app.test_client()
          r = client.get("/api/tables")
          assert r.status_code == 200
          data = r.get_json()
          assert len(data["orders"]) > 0
          assert len(data["summary"]) > 0
          print(f"OK: Flask serves {len(data['orders'])} orders, {len(data['summary'])} regions")
          EOF
