<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Orders Dashboard</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f4f6f8; color: #222; }
    header { background: #1f2937; color: #fff; padding: 18px 32px; }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 4px 0 0; font-size: 13px; color: #9ca3af; }
    main { padding: 24px 32px; }
    section { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 24px;
              box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h2 { margin: 0 0 12px; font-size: 17px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { padding: 8px 12px; border-bottom: 1px solid #e5e7eb; text-align: left; }
    th { background: #f9fafb; font-weight: 600; }
    tr:hover td { background: #f0f7ff; }
    .num { text-align: right; }
    .badge { display: inline-block; font-size: 12px; background: #ecfdf5; color: #047857;
             border-radius: 999px; padding: 2px 10px; }
  </style>
</head>
<body>
  <header>
    <h1>📦 Orders Dashboard</h1>
    <p>Merged orders (amounts in CNY) — auto-refreshes every 5 seconds</p>
  </header>
  <main>
    <section>
      <h2>Summary — average <code>amount_cny</code> per region <span class="badge" id="updated">loading…</span></h2>
      <table id="summary-table">
        <thead><tr><th>Region</th><th class="num">Avg amount (CNY)</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
    <section>
      <h2>Merged orders (orders ⋈ customers)</h2>
      <table id="orders-table">
        <thead><tr><th>Order</th><th>Customer</th><th>Region</th><th>Amount</th><th>Currency</th><th class="num">Amount CNY</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script>
    function fmt(n) { return Number(n).toLocaleString("en-US", {minimumFractionDigits: 2}); }

    function render(data) {
      const ordersBody = document.querySelector("#orders-table tbody");
      ordersBody.innerHTML = data.orders.map(o => `
        <tr><td>${o.order_id}</td><td>${o.name ?? "?"}</td><td>${o.region ?? "?"}</td>
            <td class="num">${fmt(o.amount)}</td><td>${o.currency}</td>
            <td class="num"><b>${fmt(o.amount_cny)}</b></td></tr>`).join("");

      const summaryBody = document.querySelector("#summary-table tbody");
      summaryBody.innerHTML = data.summary.map(s => `
        <tr><td>${s.region}</td><td class="num"><b>${fmt(s.avg_amount_cny)}</b></td></tr>`).join("");

      document.getElementById("updated").textContent =
        "updated " + new Date().toLocaleTimeString();
    }

    async function refresh() {
      try {
        const res = await fetch("/api/tables");
        if (res.ok) render(await res.json());
      } catch (e) { /* keep last data on transient errors */ }
    }
    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
